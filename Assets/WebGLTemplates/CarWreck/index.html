<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#101214">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>CarWreck</title>
  <style>
    :root {
      --bg: #101214; --plate: #1b1e21; --line: #31363b; --fg: #eceef0; --dim: #a3a8ae;
      --accent: #f27a1a; --danger: #ff8a7a;
      color-scheme: dark;
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: var(--bg); color: var(--fg);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      /* The game owns every gesture: no page scroll, pull-to-refresh, pinch-zoom, text selection or long-press menu. */
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    #stage { position: fixed; inset: 0; }
    #unity-canvas {
      /* Stay inside the notch / rounded corners / home bar (iPhone landscape): the on-screen buttons must not sit under them. */
      position: absolute;
      top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      display: block; background: var(--bg); outline: none; touch-action: none;
    }
    /* ---- loading state ---- */
    #loader {
      position: absolute; inset: 0; z-index: 10;
      display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: var(--bg); transition: opacity .4s ease;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    .plate {
      width: min(100%, 27rem); display: grid; gap: .85rem; box-sizing: border-box;
      padding: 1.3rem 1.4rem 1.2rem; background: var(--plate);
      border: 1px solid var(--line); border-radius: 12px;
    }
    .eyebrow { margin: 0; font-size: .75rem; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 0; font-size: 1.7rem; letter-spacing: .01em; }
    .bar { height: 10px; background: #0b0c0e; border-radius: 5px; overflow: hidden; }
    .fill { height: 100%; width: 0%; background: var(--accent); border-radius: 5px; transition: width .15s ease; }
    .status { display: flex; justify-content: space-between; gap: 1rem; font-size: .9rem; color: var(--dim); font-variant-numeric: tabular-nums; }
    .hint { margin: 0; font-size: .85rem; line-height: 1.5; color: var(--dim); }
    .hint b { color: var(--fg); font-weight: 600; }
    .build { margin: 0; font-size: .7rem; color: #6d737a; }
    .error { color: var(--danger); }
    /* ---- fullscreen button ---- */
    #fs {
      position: absolute; z-index: 5; top: 8px; left: 50%; transform: translateX(-50%);
      width: 44px; height: 32px; padding: 0; border: 1px solid rgba(255,255,255,.25); border-radius: 8px;
      background: rgba(16,18,20,.55); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; display: none;
    }
    /* ---- rotate-to-landscape prompt (phones held upright) ---- */
    #rotate {
      position: absolute; inset: 0; z-index: 20; display: none; place-items: center; text-align: center;
      background: rgba(16,18,20,.94); padding: 24px; box-sizing: border-box; font-size: 1.25rem; line-height: 1.5;
    }
    #rotate svg { width: 72px; height: 72px; display: block; margin: 0 auto 12px; animation: tilt 2s ease-in-out infinite; }
    @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: grid; } }
    @media (prefers-reduced-motion: reduce) { #loader, .fill { transition: none; } #rotate svg { animation: none; } }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="0"></canvas>
    <button id="fs" type="button" aria-label="Toggle fullscreen" title="Fullscreen">&#x26F6;</button>
    <div id="loader" role="status" aria-live="polite">
      <div class="plate">
        <p class="eyebrow">Demolition derby</p>
        <h1>CarWreck</h1>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="status"><span id="label">Loading game...</span><span id="pct">0%</span></div>
        <p class="hint" id="hint">Best in <b>landscape</b>. Desktop: <b>W / S</b> drive and brake, <b>A / D</b> steer, <b>R</b> right a flipped car, <b>Esc</b> pause. Phone: use the on-screen buttons.</p>
        <p class="build" id="build"></p>
      </div>
    </div>
    <div id="rotate">
      <div>
        <svg viewBox="0 0 24 24" fill="none" stroke="#f27a1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
        Rotate your device<br>to landscape to play
      </div>
    </div>
  </div>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const BUILD_ID = {{{ JSON.stringify(PRODUCT_VERSION) }}};
    window.carwreckBuild = BUILD_ID;
    const canvas = document.getElementById("unity-canvas");
    const fill = document.getElementById("fill");
    const pct = document.getElementById("pct");
    const label = document.getElementById("label");
    const loader = document.getElementById("loader");
    document.getElementById("build").textContent = "Build " + BUILD_ID;

    // Stale-page guard: GitHub Pages lets browsers cache index.html for ~10 minutes. If the published build is newer than this page,
    // reload once through a different URL so the newest build files are used (a ?r= page never redirects again).
    if (!/[?&]r=/.test(location.search)) {
      fetch("version.json?" + Date.now(), { cache: "no-store" }).then((r) => r.json()).then((v) => {
        if (v && v.buildId && v.buildId !== BUILD_ID) location.replace(location.pathname + "?r=" + encodeURIComponent(v.buildId));
      }).catch(() => {});
    }

    // --- keep the browser out of the way of the game ---
    const stop = (e) => e.preventDefault();
    document.addEventListener("touchmove", stop, { passive: false });
    document.addEventListener("gesturestart", stop);
    document.addEventListener("gesturechange", stop);
    document.addEventListener("contextmenu", stop);
    document.addEventListener("dblclick", stop);
    document.addEventListener("wheel", stop, { passive: false });
    window.addEventListener("keydown", (e) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Spacebar"].includes(e.key)) e.preventDefault();
    }, { passive: false });
    const focusGame = () => { try { canvas.focus({ preventScroll: true }); } catch (_) {} };
    window.addEventListener("pointerdown", focusGame);
    window.addEventListener("load", focusGame);

    const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    const isTouch = coarse || (navigator.maxTouchPoints > 0 && /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent));
    // Cap pixel density: the car is rebuilt on the CPU when damaged, so keep GPU fill cost sane on phones.
    const dpr = Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2);

    let unity = null;
    const tellTouch = () => { if (unity) unity.SendMessage("DrivingGame", "SetTouchDevice", "1"); };
    window.addEventListener("touchstart", () => { window.__touchSeen = true; tellTouch(); }, { passive: true });

    createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: BUILD_ID,
      devicePixelRatio: dpr,
      matchWebGLToCanvasSize: true,
    }, (p) => {
      const v = Math.round(p * 100);
      fill.style.width = v + "%";
      pct.textContent = v + "%";
      if (p >= 0.9) label.textContent = "Starting the game...";
    }).then((instance) => {
      unity = instance;
      window.unityInstance = instance;
      loader.classList.add("done");
      setTimeout(() => { loader.hidden = true; }, 450);
      focusGame();
      if (isTouch || window.__touchSeen) tellTouch();

      const fs = document.getElementById("fs");
      if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
        fs.style.display = "block";
        fs.addEventListener("click", async () => {
          try {
            if (document.fullscreenElement) { await document.exitFullscreen(); }
            else {
              await document.documentElement.requestFullscreen();
              if (screen.orientation && screen.orientation.lock) { screen.orientation.lock("landscape").catch(() => {}); }
            }
          } catch (_) {}
          focusGame();
        });
      }
    }).catch((err) => {
      label.textContent = "The game could not start";
      label.classList.add("error");
      pct.textContent = "";
      document.getElementById("hint").textContent = String(err && err.message ? err.message : err);
    });
  </script>
</body>
</html>
